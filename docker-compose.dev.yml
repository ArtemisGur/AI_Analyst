services:
  frontend:
    build: !reset null
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm start -- --host 0.0.0.0 --poll 1000 --proxy-config proxy.conf.json"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: !override
      - "${DEV_FRONTEND_PORT:-4201}:4200"
volumes:
  frontend-node-modules:
